<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0C0C" />
    <title>Свадебная галерея</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <!-- Библиотеки для создания ZIP-архива в браузере -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <header class="navbar">
        <h1 class="gradient-heading">Свадебная галерея</h1>
        <div class="upload-area">
            <button id="downloadAllBtn" class="btn-outline">📦 Скачать все</button>
            <span id="fileCount"></span>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2 class="hero-heading">Свадебные<br />фотографии</h2>
            <p class="hero-sub">Все моменты в одном месте</p>
        </div>
    </section>

    <section id="gallery-section" class="gallery-section">
        <div id="gallery" class="gallery-grid"></div>
        <div id="loadMoreWrapper">
            <button id="loadMoreBtn" class="btn-outline" style="display: none;">Показать ещё</button>
        </div>
    </section>

    <div id="lightboxModal" class="lightbox-modal">
        <span class="close-lightbox">&times;</span>
        <img id="lightboxImg" src="" alt="Увеличенное фото" />
    </div>

    <script src="script.js"></script>
</body>
</html>
