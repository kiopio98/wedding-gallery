<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0C0C" />
    <title>Свадебная галерея</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="navbar">
        <h1 class="gradient-heading">Свадебная галерея</h1>
        <div class="upload-area">
            <input type="file" id="fileInput" accept=".cr3,.jpg,.jpeg" multiple />
            <label for="fileInput" class="btn-outline">Выбрать файлы</label>
            <button id="uploadBtn" class="btn-gradient">Загрузить</button>
            <span id="uploadStatus"></span>
            <button id="selectToggleBtn" class="btn-outline">Выбрать фотографии</button>
            <button id="downloadSelectedBtn" class="btn-outline" style="display: none;">Скачать выбранные</button>
            <button id="deleteSelectedBtn" class="btn-outline" style="display: none; border-color: #ff4444; color: #ff4444;">Удалить выбранные</button>
            <button id="downloadAllBtn" class="btn-outline">Скачать всё</button>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2 class="hero-heading">Свадебные<br />фотографии</h2>
            <p class="hero-sub">Сохраняйте и делитесь лучшими моментами</p>
        </div>
    </section>

    <section id="gallery-section" class="gallery-section">
        <div id="gallery" class="gallery-grid"></div>
        <div id="loadMoreWrapper">
            <button id="loadMoreBtn" class="btn-outline" style="display: none;">Показать ещё</button>
        </div>
    </section>

    <div id="lightboxModal" class="lightbox-modal">
        <span class="close-lightbox">&times;</span>
        <img id="lightboxImg" src="" alt="Увеличенное фото" />
    </div>

    <script src="script.js"></script>
</body>
</html>
